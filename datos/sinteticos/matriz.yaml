# Matriz experimental de datos sintéticos (plan §4.8; decisiones del 2026-10-04 en
# contexto/bitacora-decisiones.md). La genera scripts/generar_matriz.py.
casos: [m0, m1_s1, m1_s2, m1_s3, m1_s4, m1_s5, m1_s6, m2, m3]
puntos_por_estructura: [5, 15, 40]   # N
estructuras_por_grupo: [1, 3]        # k
semillas: 10                         # 0 … 9
casos_solo_k1: [m2]                  # M2 usa vigas cortas: no forma grupo de 3
segundo_voladizo_L: 200.0e-6         # el voladizo extra de k = 3 (m)
# Se guardan 3 modos; cada método usa 1 o 3 (eje "modos medidos" del plan).
n_modos: 3
# Longitudes reservadas (plan §4.9): voladizos que ningún método ve al ajustar;
# se comparan sus frecuencias predichas con las verdaderas. Existen en el chip del
# NIST (Tabla 1 de Marshall) pero el round robin no las midió. En M2 (vigas cortas)
# se usan las mismas proporciones respecto del voladizo de referencia.
longitudes_reservadas: [248.0e-6, 348.0e-6]
